<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Novalia – Piles</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#2e7d32;--green-light:#4caf50;--green-dark:#1b5e20;
  --red:#c62828;--blue:#1565c0;--orange:#e65100;
  --bg:#f5f5f5;--card:#fff;--text:#212121;--sub:#757575;--border:#e0e0e0;
  --radius:12px;--shadow:0 2px 8px rgba(0,0,0,.12);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
#header{background:var(--green-dark);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top))}
#header h1{font-size:18px;font-weight:700;letter-spacing:.3px}
#btn-add{background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
#btn-sync{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#btn-sync svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.header-actions{display:flex;gap:8px;align-items:center}

/* Nav */
#nav{display:flex;background:#fff;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-tab{flex:1;padding:10px 4px 8px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);font-size:10px;font-weight:500;transition:color .2s}
.nav-tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-tab.active{color:var(--green)}

/* Content */
#content{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.view.active{display:flex}

/* Map */
#map{flex:1}

/* List views */
.list-header{padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.search-box{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:20px;font-size:14px;outline:none;background:var(--bg)}
.list-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list-item{background:#fff;margin:8px 12px;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:stretch;overflow:hidden;cursor:pointer;transition:transform .1s}
.list-item:active{transform:scale(.98)}
.item-color{width:6px;flex-shrink:0}
.item-color.pila{background:var(--blue)}
.item-color.client{background:var(--red)}
.item-body{padding:12px;flex:1;min-width:0}
.item-nom{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:12px;color:var(--sub);margin-top:2px}
.item-actions{display:flex;align-items:center;padding-right:8px;gap:4px}
.icon-btn{background:none;border:none;padding:6px;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.icon-btn:active{background:var(--bg)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.empty-state{text-align:center;padding:60px 24px;color:var(--sub)}
.empty-state svg{width:48px;height:48px;stroke:var(--border);fill:none;stroke-width:1.5;margin-bottom:12px}

/* Modal */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
#overlay.open{display:flex}
#modal{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:0 0 env(safe-area-inset-bottom);max-height:92dvh;display:flex;flex-direction:column}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 4px}
.modal-head{padding:8px 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--sub);padding:4px;line-height:1}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.form-input{padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;outline:none;background:#fff;transition:border-color .2s}
.form-input:focus{border-color:var(--green)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.form-input{resize:none;height:72px}
.btn-gps{padding:10px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500;color:var(--text);transition:all .2s}
.btn-gps:active,.btn-gps:hover{border-color:var(--green);color:var(--green)}
.btn-gps svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.type-tabs{display:flex;gap:8px}
.type-tab{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;background:#fff;transition:all .2s;color:var(--sub)}
.type-tab.sel-pila{border-color:var(--blue);background:#e3f2fd;color:var(--blue)}
.type-tab.sel-client{border-color:var(--red);background:#ffebee;color:var(--red)}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.btn-primary{flex:1;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;background:var(--green);color:#fff;transition:opacity .2s}
.btn-primary:active{opacity:.8}
.btn-danger{padding:14px 18px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;background:#ffebee;color:var(--red)}

/* Detail modal */
#detail{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:201;display:none;align-items:flex-end;justify-content:center}
#detail.open{display:flex}
#detail-panel{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom);max-height:80dvh;display:flex;flex-direction:column}
.detail-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.detail-badge{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.badge-pila{background:#e3f2fd}
.badge-client{background:#ffebee}
.detail-nom{font-weight:700;font-size:16px;line-height:1.3}
.detail-type{font-size:12px;color:var(--sub);margin-top:2px;text-transform:uppercase;font-weight:600}
.detail-close{margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--sub)}
.detail-body{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.detail-coords{font-size:13px;color:var(--sub);font-family:monospace;background:var(--bg);padding:8px 12px;border-radius:8px}
.detail-notes{font-size:14px;color:var(--text);background:var(--bg);padding:10px 12px;border-radius:8px;white-space:pre-wrap}
.share-section{display:flex;flex-direction:column;gap:8px}
.share-label{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.share-btns{display:flex;flex-direction:column;gap:8px}
.btn-share{padding:13px 16px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;transition:opacity .2s}
.btn-share:active{opacity:.8}
.btn-share svg{width:20px;height:20px;flex-shrink:0}
.btn-wa{background:#25D366;color:#fff}
.btn-maps{background:#4285f4;color:#fff}
.btn-copy{background:var(--bg);color:var(--text);border:1.5px solid var(--border)}
.detail-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px}
.btn-edit{flex:1;padding:13px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text)}
.btn-del{padding:13px 16px;background:#ffebee;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--red)}

/* Sync sheet */
#sync-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:202;display:none;align-items:flex-end;justify-content:center}
#sync-overlay.open{display:flex}
#sync-sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
.btn-sync-action{width:100%;padding:16px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;transition:opacity .2s}
.btn-sync-action:active{opacity:.75}

/* Map popup */
.leaflet-popup-content{font-size:14px;font-weight:600;min-width:120px}
.popup-link{display:block;margin-top:6px;font-size:12px;color:var(--blue);font-weight:400;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<div id="header">
  <h1>Novalia – Piles</h1>
  <div class="header-actions">
    <button id="btn-sync">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9m-9 9a9 9 0 019-9"/></svg>
    </button>
    <button id="btn-add">+</button>
  </div>
</div>

<div id="content">
  <!-- MAP -->
  <div class="view active" id="view-mapa">
    <div id="map"></div>
  </div>

  <!-- PILES -->
  <div class="view" id="view-piles">
    <div class="list-header">
      <input class="search-box" id="search-piles" placeholder="Buscar pila..." type="search">
    </div>
    <div class="list-body" id="list-piles"></div>
  </div>

  <!-- CLIENTS -->
  <div class="view" id="view-clients">
    <div class="list-header">
      <input class="search-box" id="search-clients" placeholder="Buscar client..." type="search">
    </div>
    <div class="list-body" id="list-clients"></div>
  </div>
</div>

<nav id="nav">
  <button class="nav-tab active" data-view="mapa">
    <svg viewBox="0 0 24 24"><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
    Mapa
  </button>
  <button class="nav-tab" data-view="piles">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
    Piles
  </button>
  <button class="nav-tab" data-view="clients">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Clients
  </button>
</nav>

<!-- SYNC SHEET -->
<div id="sync-overlay">
  <div id="sync-sheet">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <span class="modal-title">KML / OneDrive</span>
      <button class="modal-close" onclick="closeSyncSheet()">×</button>
    </div>
    <div class="modal-body" style="gap:10px">
      <p style="font-size:13px;color:var(--sub);line-height:1.5">El KML és la font de veritat. Importa per carregar dades des d'OneDrive, exporta per desar els canvis.</p>
      <button class="btn-sync-action" style="background:#e3f2fd;color:var(--blue)" onclick="importKML()">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Importar KML des d'OneDrive
      </button>
      <button class="btn-sync-action" style="background:#e8f5e9;color:var(--green)" onclick="exportKML()">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar KML actualitzat
      </button>
      <div id="sync-info" style="font-size:12px;color:var(--sub);text-align:center;padding:4px 0"></div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div id="overlay">
  <div id="modal">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <span class="modal-title" id="modal-title">Nou punt</span>
      <button class="modal-close" id="modal-close-btn">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <div class="form-label">Tipus</div>
        <div class="type-tabs">
          <button class="type-tab sel-pila" id="tab-pila" onclick="setType('pila')">Pila biomassa</button>
          <button class="type-tab" id="tab-client" onclick="setType('client')">Client</button>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">Nom</div>
        <input class="form-input" id="f-nom" placeholder="Nom del punt" type="text">
      </div>
      <div class="form-group">
        <div class="form-label">Coordenades</div>
        <div class="form-row">
          <input class="form-input" id="f-lat" placeholder="Latitud" type="number" step="any">
          <input class="form-input" id="f-lng" placeholder="Longitud" type="number" step="any">
        </div>
        <button class="btn-gps" onclick="captureGPS()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7" stroke-dasharray="4"/></svg>

        </button>
      </div>
      <div class="form-group">
        <div class="form-label">Notes</div>
        <textarea class="form-input" id="f-notes" placeholder="Tones estimades, accés, observacions..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-danger" id="btn-del-modal" style="display:none" onclick="deletePoint()">Eliminar</button>
      <button class="btn-primary" onclick="savePoint()">Desar</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div id="detail">
  <div id="detail-panel">
    <div class="modal-handle"></div>
    <div class="detail-header">
      <div class="detail-badge" id="d-badge">📍</div>
      <div>
        <div class="detail-nom" id="d-nom"></div>
        <div class="detail-type" id="d-type"></div>
      </div>
      <button class="detail-close" onclick="closeDetail()">×</button>
    </div>
    <div class="detail-body">
      <div class="detail-coords" id="d-coords"></div>
      <div class="detail-notes" id="d-notes" style="display:none"></div>
      <div class="share-section">
        <div class="share-label">Compartir</div>
        <div class="share-btns">
          <button class="btn-share btn-wa" onclick="shareWhatsApp()">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 2C6.477 2 2 6.477 2 12c0 1.89.527 3.659 1.444 5.163L2 22l4.946-1.424A9.956 9.956 0 0011.999 22C17.522 22 22 17.523 22 12S17.522 2 11.999 2zm0 18.12a8.1 8.1 0 01-4.163-1.147l-.299-.177-3.092.891.897-3.003-.194-.31A8.12 8.12 0 013.88 12c0-4.48 3.64-8.12 8.12-8.12s8.12 3.64 8.12 8.12-3.64 8.12-8.121 8.12z"/></svg>

          <button class="btn-share btn-maps" onclick="openMaps()">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Obrir a Google Maps
          </button>
          <button class="btn-share btn-copy" onclick="copyInfo()">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            Copiar informació
          </button>
        </div>
      </div>
    </div>
    <div class="detail-footer">
      <button class="btn-edit" onclick="editCurrent()">Editar</button>
      <button class="btn-del" onclick="deleteCurrentDetail()">Eliminar</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─── DATA ────────────────────────────────────────────────────────
function loadData(){
  try{
    const s=localStorage.getItem('novalia_v3');
    return s?JSON.parse(s):{piles:[],clients:[]};
  }catch{return {piles:[],clients:[]};}
}
function saveData(){localStorage.setItem('novalia_v3',JSON.stringify(DB));}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// ─── KML IMPORT / EXPORT ─────────────────────────────────────────
function openSyncSheet(){document.getElementById('sync-overlay').classList.add('open');}
function closeSyncSheet(){document.getElementById('sync-overlay').classList.remove('open');}
document.getElementById('sync-overlay').addEventListener('click',function(e){if(e.target===this)closeSyncSheet();});

function importKML(){
  const input=document.createElement('input');
  input.type='file';input.accept='.kml';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>parseAndLoadKML(ev.target.result,file.name);
    reader.readAsText(file);
  };
  input.click();
}

function parseAndLoadKML(xml,filename){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  const folders=doc.querySelectorAll('Folder');
  const newDB={piles:[],clients:[]};
  folders.forEach(folder=>{
    const folderName=folder.querySelector('name').textContent.trim();
    const isClient=folderName.toLowerCase().includes('client');
    folder.querySelectorAll('Placemark').forEach(pm=>{
      const nom=pm.querySelector('name').textContent.trim();
      const rawCoords=pm.querySelector('coordinates').textContent.trim().split(',');
      const lng=parseFloat(rawCoords[0]);
      const lat=parseFloat(rawCoords[1]);
      const descEl=pm.querySelector('description');
      const notes=descEl?descEl.textContent.trim():'';
      const item={id:uid(),nom,lat,lng,notes};
      if(isClient)newDB.clients.push(item);else newDB.piles.push(item);
    });
  });
  if(!confirm(`Importar ${newDB.piles.length} piles i ${newDB.clients.length} clients de "${filename}"?\nAixò sobreescriurà les dades actuals.`))return;
  DB=newDB;
  saveData();renderMapMarkers();
  renderList('piles');renderList('clients');
  const d=new Date();
  document.getElementById('sync-info').textContent=`Importat ${filename} — ${d.toLocaleDateString('ca')} ${d.toLocaleTimeString('ca',{hour:'2-digit',minute:'2-digit'})}`;
  closeSyncSheet();
}

function escapeXML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function exportKML(){
  const pilesXML=DB.piles.map(p=>`    <Placemark>
      <name>${escapeXML(p.nom)}</name>
      <styleUrl>#pila</styleUrl>${p.notes?`\n      <description>${escapeXML(p.notes)}</description>`:''}
      <Point><coordinates>${p.lng},${p.lat},0</coordinates></Point>
    </Placemark>`).join('\n');
  const clientsXML=DB.clients.map(c=>`    <Placemark>
      <name>${escapeXML(c.nom)}</name>
      <styleUrl>#client</styleUrl>${c.notes?`\n      <description>${escapeXML(c.notes)}</description>`:''}
      <Point><coordinates>${c.lng},${c.lat},0</coordinates></Point>
    </Placemark>`).join('\n');
  const kml=`<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
  <name>Novalia – Piles de Biomassa i Clients</name>
  <Style id="pila">
    <IconStyle><Icon><href>http://maps.google.com/mapfiles/ms/icons/blue-dot.png</href></Icon></IconStyle>
  </Style>
  <Style id="client">
    <IconStyle><Icon><href>http://maps.google.com/mapfiles/ms/icons/red-dot.png</href></Icon></IconStyle>
  </Style>
  <Folder>
    <name>Piles de Biomassa</name>
${pilesXML}
  </Folder>
  <Folder>
    <name>Clients</name>
${clientsXML}
  </Folder>
</Document>
</kml>`;
  const blob=new Blob([kml],{type:'application/vnd.google-earth.kml+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='novalia-piles.kml';a.click();
  URL.revokeObjectURL(url);
  closeSyncSheet();
}

let DB=loadData();

// ─── MAP ─────────────────────────────────────────────────────────
let map, mapMarkers=[];
function initMap(){
  map=L.map('map',{zoomControl:true}).setView([41.7,1.7],8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:19
  }).addTo(map);
  renderMapMarkers();
}

function makeIcon(type){
  const bg=type==='pila'?'#1565c0':'#c62828';
  return L.divIcon({
    className:'',
    html:`<div style="background:${bg};width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)"></div>`,
    iconSize:[16,16],iconAnchor:[8,8],popupAnchor:[0,-10]
  });
}

function renderMapMarkers(){
  mapMarkers.forEach(m=>map.removeLayer(m));
  mapMarkers=[];
  DB.piles.forEach(p=>{
    const m=L.marker([p.lat,p.lng],{icon:makeIcon('pila')})
      .addTo(map)
      .bindPopup(`<b>${p.nom}</b><br><span class="popup-link" onclick="openDetailById('${p.id}','pila')">Veure detalls / Compartir</span>`);
    mapMarkers.push(m);
  });
  DB.clients.forEach(c=>{
    const m=L.marker([c.lat,c.lng],{icon:makeIcon('client')})
      .addTo(map)
      .bindPopup(`<b>${c.nom}</b><br><span class="popup-link" onclick="openDetailById('${c.id}','client')">Veure detalls / Compartir</span>`);
    mapMarkers.push(m);
  });
}

// ─── NAVIGATION ──────────────────────────────────────────────────
document.querySelectorAll('.nav-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const v=btn.dataset.view;
    document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(d=>d.classList.remove('active'));
    document.getElementById('view-'+v).classList.add('active');
    if(v==='mapa')setTimeout(()=>map.invalidateSize(),10);
    if(v==='piles')renderList('piles');
    if(v==='clients')renderList('clients');
  });
});

// ─── LISTS ───────────────────────────────────────────────────────
function renderList(type){
  const items=type==='piles'?DB.piles:DB.clients;
  const search=document.getElementById('search-'+type).value.toLowerCase();
  const container=document.getElementById('list-'+type);
  const filtered=items.filter(i=>i.nom.toLowerCase().includes(search));
  if(!filtered.length){
    const noData=items.length===0&&!search;
    container.innerHTML=noData
      ?`<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><div>Sense dades</div><div style="margin-top:8px"><button onclick="openSyncSheet()" style="padding:10px 20px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer">Importar KML</button></div></div>`
      :`<div class="empty-state"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg><div>Cap ${type==='piles'?'pila':'client'} trobat</div></div>`;
    return;
  }
  container.innerHTML=filtered.map(i=>`
    <div class="list-item" onclick="openDetailById('${i.id}','${type==='piles'?'pila':'client'}')">
      <div class="item-color ${type==='piles'?'pila':'client'}"></div>
      <div class="item-body">
        <div class="item-nom">${i.nom}</div>
        <div class="item-sub">${i.lat.toFixed(5)}, ${i.lng.toFixed(5)}</div>
      </div>
      <div class="item-actions">
        <button class="icon-btn" onclick="event.stopPropagation();shareWhatsAppById('${i.id}','${type==='piles'?'pila':'client'}')" title="WhatsApp">
          <svg viewBox="0 0 24 24" fill="#25D366" stroke="none"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 2C6.477 2 2 6.477 2 12c0 1.89.527 3.659 1.444 5.163L2 22l4.946-1.424A9.956 9.956 0 0011.999 22C17.522 22 22 17.523 22 12S17.522 2 11.999 2zm0 18.12a8.1 8.1 0 01-4.163-1.147l-.299-.177-3.092.891.897-3.003-.194-.31A8.12 8.12 0 013.88 12c0-4.48 3.64-8.12 8.12-8.12s8.12 3.64 8.12 8.12-3.64 8.12-8.121 8.12z"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

document.getElementById('search-piles').addEventListener('input',()=>renderList('piles'));
document.getElementById('search-clients').addEventListener('input',()=>renderList('clients'));

// ─── DETAIL ──────────────────────────────────────────────────────
let currentDetail=null;

function openDetailById(id,type){
  const arr=type==='pila'?DB.piles:DB.clients;
  const item=arr.find(i=>i.id===id);
  if(!item)return;
  currentDetail={...item,type};
  document.getElementById('d-nom').textContent=item.nom;
  document.getElementById('d-type').textContent=type==='pila'?'Pila de biomassa':'Client / Destinació';
  document.getElementById('d-badge').textContent=type==='pila'?'🪵':'🏭';
  document.getElementById('d-badge').className='detail-badge '+(type==='pila'?'badge-pila':'badge-client');
  document.getElementById('d-coords').textContent=`${item.lat.toFixed(6)}, ${item.lng.toFixed(6)}`;
  const notesEl=document.getElementById('d-notes');
  if(item.notes){notesEl.textContent=item.notes;notesEl.style.display='block';}
  else{notesEl.style.display='none';}
  document.getElementById('detail').classList.add('open');
  // close any open popup
  if(map)map.closePopup();
}

function closeDetail(){document.getElementById('detail').classList.remove('open');}
document.getElementById('detail').addEventListener('click',function(e){if(e.target===this)closeDetail();});

function buildMessage(item){
  const mapsUrl=`https://maps.google.com/?q=${item.lat},${item.lng}`;
  const tipus=item.type==='pila'?'Pila de biomassa':'Client / Destinació';
  let msg=`🪵 *Novalia Forestal*\n📌 *${item.nom}*\n📍 Tipus: ${tipus}\n🗺️ Ubicació: ${mapsUrl}`;
  if(item.notes)msg+=`\n📝 Notes: ${item.notes}`;
  return msg;
}

function shareWhatsApp(){
  if(!currentDetail)return;
  const msg=buildMessage(currentDetail);
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
}

function shareWhatsAppById(id,type){
  const arr=type==='pila'?DB.piles:DB.clients;
  const item=arr.find(i=>i.id===id);
  if(!item)return;
  const msg=buildMessage({...item,type});
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
}

function openMaps(){
  if(!currentDetail)return;
  window.open(`https://maps.google.com/?q=${currentDetail.lat},${currentDetail.lng}`,'_blank');
}

function copyInfo(){
  if(!currentDetail)return;
  const msg=buildMessage(currentDetail);
  if(navigator.clipboard){
    navigator.clipboard.writeText(msg).then(()=>alert('Copiat!'));
  }else{
    const ta=document.createElement('textarea');
    ta.value=msg;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    alert('Copiat!');
  }
}

function editCurrent(){
  if(!currentDetail)return;
  closeDetail();
  setTimeout(()=>openModal(currentDetail.type,currentDetail),200);
}

function deleteCurrentDetail(){
  if(!currentDetail)return;
  if(!confirm(`Eliminar "${currentDetail.nom}"?`))return;
  const arr=currentDetail.type==='pila'?DB.piles:DB.clients;
  const key=currentDetail.type==='pila'?'piles':'clients';
  DB[key]=arr.filter(i=>i.id!==currentDetail.id);
  saveData();renderMapMarkers();
  renderList(currentDetail.type==='pila'?'piles':'clients');
  closeDetail();
}

// ─── ADD / EDIT MODAL ────────────────────────────────────────────
let editingId=null,editingType='pila';

function setType(t){
  editingType=t;
  document.getElementById('tab-pila').className='type-tab'+(t==='pila'?' sel-pila':'');
  document.getElementById('tab-client').className='type-tab'+(t==='client'?' sel-client':'');
}

function openModal(type,item){
  editingId=item?item.id:null;
  editingType=type||'pila';
  document.getElementById('modal-title').textContent=item?'Editar punt':'Nou punt';
  document.getElementById('btn-del-modal').style.display=item?'block':'none';
  document.getElementById('f-nom').value=item?item.nom:'';
  document.getElementById('f-lat').value=item?item.lat:'';
  document.getElementById('f-lng').value=item?item.lng:'';
  document.getElementById('f-notes').value=item?item.notes:'';
  setType(editingType);
  document.getElementById('overlay').classList.add('open');
}

document.getElementById('btn-add').addEventListener('click',()=>openModal('pila',null));
document.getElementById('btn-sync').addEventListener('click',openSyncSheet);
document.getElementById('modal-close-btn').addEventListener('click',closeModal);
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

function closeModal(){document.getElementById('overlay').classList.remove('open');}

function captureGPS(){
  if(!navigator.geolocation){alert('GPS no disponible');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    document.getElementById('f-lat').value=pos.coords.latitude.toFixed(7);
    document.getElementById('f-lng').value=pos.coords.longitude.toFixed(7);
  },()=>alert('No s\'ha pogut obtenir la ubicació GPS'));
}

function savePoint(){
  const nom=document.getElementById('f-nom').value.trim();
  const lat=parseFloat(document.getElementById('f-lat').value);
  const lng=parseFloat(document.getElementById('f-lng').value);
  const notes=document.getElementById('f-notes').value.trim();
  if(!nom){alert('Cal posar un nom');return;}
  if(isNaN(lat)||isNaN(lng)){alert('Cal posar coordenades vàlides');return;}
  const key=editingType==='pila'?'piles':'clients';
  if(editingId){
    const idx=DB[key].findIndex(i=>i.id===editingId);
    if(idx>=0)DB[key][idx]={id:editingId,nom,lat,lng,notes};
  }else{
    DB[key].push({id:uid(),nom,lat,lng,notes});
  }
  saveData();renderMapMarkers();
  renderList('piles');renderList('clients');
  closeModal();
}

function deletePoint(){
  if(!editingId)return;
  const key=editingType==='pila'?'piles':'clients';
  const item=DB[key].find(i=>i.id===editingId);
  if(!confirm(`Eliminar "${item?.nom}"?`))return;
  DB[key]=DB[key].filter(i=>i.id!==editingId);
  saveData();renderMapMarkers();
  renderList('piles');renderList('clients');
  closeModal();
}

// ─── INIT ────────────────────────────────────────────────────────
window.addEventListener('load',()=>{
  initMap();
  renderList('piles');
  renderList('clients');
});
</script>
